# Epic 1.3 · User Story 1.3.1 — Redis session cache configuration

# Memory limit + eviction (LRU)
maxmemory 2gb
maxmemory-policy allkeys-lru

# Persistence off for session cache (fast; sessions are ephemeral)
save ""
appendonly no

# Networking
bind 0.0.0.0
port 6379
protected-mode no

# Logging
loglevel notice
